name: Generate contribution brickfall

# This is the only workflow that publishes to the `output` branch.
# crazy-max/ghaction-github-pages force-pushes a fresh commit containing exactly
# the contents of `dist/` (keep_history defaults to false), so every file that
# must live on `output` (tetris SVGs + travel-map.svg, plus the static PNG) is
# staged into dist/ here.
#
# Seasonal palette: on Oct 31 (UTC date of the run), or when picked manually,
# the tetris SVGs use contrib-tetris's halloween palette and dist/travel-map.svg
# is a copy of assets/travel-map-halloween.svg; on every other day both use the
# default palette (assets/travel-map.svg). The README embeds
# https://raw.githubusercontent.com/KenYanL/KenYanL/output/travel-map.svg
# dist/travel-map.png is still published so the previous raw URL keeps working.
# Those PNGs are the static visited maps and do not carry the SMIL planned blink.

on:
  schedule:
    - cron: "7 0 * * *"    # daily, just after 00:00 UTC, so the seasonal swap lands near the UTC date change
    - cron: "17 6 * * *"   # daily (original refresh time)
  workflow_dispatch:
    inputs:
      palette:
        description: "Tetris graph and travel map palette (auto = halloween on Oct 31 UTC, default otherwise)"
        type: choice
        options: [auto, default, halloween]
        default: auto
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-output-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One date decision for both the tetris graph and the travel map.
      - name: Pick seasonal palette (UTC date)
        id: season
        env:
          REQUESTED: ${{ github.event.inputs.palette || 'auto' }}
        run: |
          palette="$REQUESTED"
          if [ "$palette" = "auto" ]; then
            if [ "$(date -u +%m-%d)" = "10-31" ]; then palette=halloween; else palette=default; fi
          fi
          echo "palette=$palette" >> "$GITHUB_OUTPUT"
          echo "UTC date $(date -u +%F), palette: $palette"

      - uses: KenYanL/contrib-tetris@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_light_path: dist/tetris-contrib.svg
          svg_dark_path: dist/tetris-contrib-dark.svg
          palette: ${{ steps.season.outputs.palette }}

      - name: Stage seasonal travel map
        env:
          PALETTE: ${{ steps.season.outputs.palette }}
        run: |
          if [ "$PALETTE" = "halloween" ]; then
            svg=assets/travel-map-halloween.svg
            png=assets/travel-map-halloween.png
          else
            svg=assets/travel-map.svg
            png=assets/travel-map.png
          fi
          echo "palette: $PALETTE, svg: $svg, png: $png"
          test -f "$svg"
          test -f "$png"
          mkdir -p dist
          cp "$svg" dist/travel-map.svg
          cp "$png" dist/travel-map.png
          ls -la dist

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
