name: Generate contribution brickfall

# This is the only workflow that publishes to the `output` branch.
# crazy-max/ghaction-github-pages force-pushes a fresh commit containing exactly
# the contents of `dist/` (keep_history defaults to false), so every file that
# must live on `output` (tetris SVGs + travel-map.svg, plus the static PNG) is
# staged into dist/ here.
#
# Palettes are no longer pre-resolved in this repo (that path only knew
# Halloween). contrib-tetris@v1 gets `palette: auto` and applies its own
# catalog, including the dual-holiday fade when a Chinese festival and a
# Western holiday share a UTC day.
#
#   On the current moving v1 tag (v1.5.0, 2026-11-16): halloween, christmas,
#   newyear, lunarnewyear, and valentine, including the dual-holiday fade.
#   Mid-Autumn is only on a local unreleased branch; auto will pick it up
#   once that palette is released and v1 moves.
#
# The travel map uses the same UTC holidays as contrib-tetris, resolved by
# scripts/resolve_travel_palette.py: valentine (14 Feb), lunarnewyear and
# midautumn (the same three-day windows), newyear (1 Jan), halloween
# (31 Oct), and christmas (24-26 Dec). On a dual-holiday day the static
# map uses the Chinese festival. Assets live in assets/travel-map-<name>.
# The newyear and lunarnewyear SVGs include New Year firecracker bursts
# over visited cities; the PNG stays static. The README embeds
# https://raw.githubusercontent.com/KenYanL/KenYanL/output/travel-map.svg
# dist/travel-map.png is still published so the previous raw URL keeps working.
# Those PNGs are the static visited maps and do not carry the SMIL planned
# blink or the firecracker animation.

on:
  schedule:
    - cron: "7 0 * * *"    # daily, just after 00:00 UTC, so the holiday swap lands near the UTC date change
    - cron: "17 3-23/3 * * *"  # every 3 hours after that, so same-day contributions show up within a few hours
  workflow_dispatch:
    inputs:
      palette:
        description: "Palette for the tetris graph and travel map (auto = each tool's holiday catalog on the same UTC days). A concrete name uses a matching travel asset when one exists."
        type: choice
        options: [auto, default, halloween, christmas, newyear, lunarnewyear, valentine]
        default: auto
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-output-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: KenYanL/contrib-tetris@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_light_path: dist/tetris-contrib.svg
          svg_dark_path: dist/tetris-contrib-dark.svg
          palette: ${{ github.event.inputs.palette || 'auto' }}

      - name: Stage seasonal travel map
        env:
          REQUESTED: ${{ github.event.inputs.palette || 'auto' }}
        run: |
          set -euo pipefail
          eval "$(python3 scripts/resolve_travel_palette.py)"
          echo "travel palette: $PALETTE (UTC $DATE_UTC)"
          test -f "$SVG"
          test -f "$PNG"
          mkdir -p dist
          cp "$SVG" dist/travel-map.svg
          cp "$PNG" dist/travel-map.png
          ls -la dist

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
